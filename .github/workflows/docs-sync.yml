name: Update project documentation

on:
  push:
    branches: [develop, main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.toml'
      - 'gradle.properties'
      - '.github/workflows/release.yml'
      - '.github/workflows/docs-sync.yml'
      - '.github/scripts/docs-sync-status*.cjs'
      - '.github/scripts/docs-sync-run.sh'
      - '.github/scripts/agent-*.cjs'
  workflow_dispatch:
    inputs:
      base:
        description: 'Full base SHA before the merged change'
        required: true
      head:
        description: 'Full merged SHA to analyse'
        required: true

permissions:
  contents: write

concurrency:
  group: docs-sync-${{ github.ref_name }}-${{ inputs.head || github.sha }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASSISTANT_RUNTIME_REF: 34d437d5c03e90cec43703c5b49659f750324fc6
      TARGET_BRANCH: ${{ github.ref_name }}
      BASE_SHA: ${{ inputs.base || github.event.before }}
      MERGED_SHA: ${{ inputs.head || github.sha }}
      LLM_EXECUTION_MODE: economy
      LLM_MAX_CALLS: ${{ vars.LLM_MAX_CALLS || '24' }}
      LLM_MAX_INPUT_CHARACTERS: ${{ vars.LLM_MAX_INPUT_CHARACTERS || '1000000' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-flash' }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}
    steps:
      # Only code already in the target branch is read as data. No project scripts run.
      - name: Checkout current target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Checkout verified assistant runtime
        uses: actions/checkout@v4
        with:
          repository: Flobsterable/cosplay-dev-assistant
          ref: ${{ env.ASSISTANT_RUNTIME_REF }}
          path: .assistant-runtime
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .assistant-runtime/tools/dev-assistant/package-lock.json
      - name: Install assistant dependencies
        run: npm ci --ignore-scripts
        working-directory: .assistant-runtime/tools/dev-assistant
      - name: Validate source range
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in develop|main) ;; *) echo 'Unsupported target branch'; exit 1 ;; esac
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$MERGED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$MERGED_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$MERGED_SHA"
          git merge-base --is-ancestor "$MERGED_SHA" HEAD
          echo "Source range: $BASE_SHA..$MERGED_SHA; target: $TARGET_BRANCH"
      - name: Test recovery tracker
        run: node --test .github/scripts/docs-sync-status.test.cjs .github/scripts/agent-workflows.test.cjs
      - name: Compute response cache configuration
        id: cache-config
        run: |
          node -e "const keys = ['LLM_MODEL', 'LLM_BASE_URL', 'LLM_EXECUTION_MODE', 'LLM_MAX_CALLS', 'LLM_MAX_INPUT_CHARACTERS']; const hash = require('node:crypto').createHash('sha256').update(JSON.stringify(keys.map(k => process.env[k] || ''))).digest('hex'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'hash=' + hash + '\n');"
      - name: Restore matching model responses
        id: responses
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/assistant-cache
          key: docs-responses-v1-${{ env.ASSISTANT_RUNTIME_REF }}-${{ steps.cache-config.outputs.hash }}-${{ env.BASE_SHA }}-${{ env.MERGED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            docs-responses-v1-${{ env.ASSISTANT_RUNTIME_REF }}-${{ steps.cache-config.outputs.hash }}-${{ env.BASE_SHA }}-${{ env.MERGED_SHA }}-
            docs-responses-v1-${{ env.ASSISTANT_RUNTIME_REF }}-${{ steps.cache-config.outputs.hash }}-
      - name: Generate, verify and commit documentation
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CACHE_DIR: ${{ runner.temp }}/assistant-cache
        shell: bash
        run: |
          # Snapshot the script before its git reset can replace tracked files.
          bash -c "$(cat .github/scripts/docs-sync-run.sh)"
      - name: Preserve reusable responses after success or failure
        if: ${{ always() && steps.responses.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/assistant-cache
          key: ${{ steps.responses.outputs.cache-primary-key }}
      - name: Save generation and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/docs-sync-*.txt
            ${{ runner.temp }}/docs-sync-generated.patch
          if-no-files-found: ignore
          retention-days: 14

  status:
    name: Track documentation recovery
    needs: sync
    if: ${{ always() && (needs.sync.result == 'failure' || needs.sync.result == 'success' || needs.sync.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: docs-sync-status-${{ github.ref_name }}-${{ inputs.head || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Open or resolve recovery issue
        uses: actions/github-script@v8
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          BASE_SHA: ${{ inputs.base || github.event.before }}
          MERGED_SHA: ${{ inputs.head || github.sha }}
          SYNC_RESULT: ${{ needs.sync.result }}
        with:
          retries: 3
          script: |
            const track = require('./.github/scripts/docs-sync-status.cjs');
            await track({ github, context, core, env: process.env });
